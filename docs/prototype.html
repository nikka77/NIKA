<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NIKA — Prototype (app live)</title>
<meta name="description" content="Le prototype NIKA a évolué en app complète, live sur Vercel." />
<!-- Le « prototype » est désormais l'app réelle, déployée sur Vercel. Redirection auto. -->
<meta http-equiv="refresh" content="2; url=https://nika-murex.vercel.app" />
<link rel="canonical" href="https://nika-murex.vercel.app" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:ital,wght@1,900&family=Outfit:wght@400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#050C17;--az:#0094D4;--az2:#00C2FF;--td:#EBE5D4;--td2:#8AACBC;--td3:#4A6880;
    --fn:'Bebas Neue',sans-serif;--fe:'Exo 2',sans-serif;--fo:'Outfit',sans-serif}
  html,body{height:100%}
  body{background:var(--bg);color:var(--td);font-family:var(--fo);display:flex;align-items:center;justify-content:center;text-align:center;
    background-image:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(0,148,212,.12),transparent 60%)}
  .wrap{max-width:480px;padding:2rem}
  .logo{font-family:var(--fn);font-size:64px;letter-spacing:.08em;line-height:1}
  .logo span.k{color:var(--az)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--az2);box-shadow:0 0 10px var(--az2);margin-left:6px;vertical-align:middle;animation:p 1.6s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
  .eyebrow{font-family:var(--fo);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--td3);margin:1.4rem 0 .6rem}
  h1{font-family:var(--fe);font-size:clamp(24px,5vw,34px);font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.05;margin-bottom:.8rem}
  p{font-family:var(--fo);font-size:14px;color:var(--td2);line-height:1.7;margin-bottom:1.8rem}
  .btn{display:inline-block;font-family:var(--fe);font-size:14px;font-weight:900;font-style:italic;letter-spacing:.04em;text-transform:uppercase;
    padding:13px 30px;border-radius:4px;text-decoration:none;background:linear-gradient(90deg,var(--az),var(--az2));color:#fff;box-shadow:0 0 30px rgba(0,148,212,.35)}
  .alt{display:block;margin-top:1.2rem;font-size:12px;color:var(--td3)}
  .alt a{color:var(--az);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">NI<span class="k">KA</span><span class="dot"></span></div>
    <div class="eyebrow">Le prototype a grandi</div>
    <h1>L'app NIKA est<br>maintenant en ligne</h1>
    <p>Le prototype d'origine est devenu une app complète (9 domaines, membres numérotés, badges, food de nuit, carte live). Redirection vers la version réelle…</p>
    <a class="btn" href="https://nika-murex.vercel.app">Ouvrir NIKA →</a>
    <span class="alt">Pas redirigé ? <a href="https://nika-murex.vercel.app">nika-murex.vercel.app</a> · <a href="index.html">aperçu du projet</a></span>
  </div>
</body>
</html>
